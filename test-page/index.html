<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wake Word Tuner</title>
<style>
	body { font: 16px system-ui, sans-serif; margin: 0 auto; max-width: 720px; padding: 16px; }
	canvas { width: 100%; height: 200px; border: 1px solid #8884; border-radius: 6px; display: block; }
	.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
	#status { min-height: 1.4em; }
	#status.err { color: #c0392b; }
	input[type=range] { flex: 1; min-width: 160px; }
	output { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Wake Word Tuner</h1>
<div class="row">
	<label>Bundle <input id="bundle" value="/hey_jarvis.wakeword" size="28"></label>
	<button id="load">Load</button>
</div>
<div id="status">Load a bundle to begin.</div>

<canvas id="graph" width="1440" height="400"></canvas>

<div class="row">
	<label for="thr">Threshold</label>
	<input id="thr" type="range" min="0.05" max="0.99" step="0.01" value="0.5" disabled>
	<output id="thrOut">0.50</output>
</div>
<div class="row">
	<button id="start" disabled>Start listening</button>
	<button id="stop" disabled>Stop</button>
	<span>Detections: <b id="hits">0</b></span>
	<button id="false" disabled>False trigger (<span id="falses">0</span>)</button>
</div>
<div class="row">
	<label>Test a WAV file <input id="file" type="file" accept="audio/*" disabled></label>
</div>
<div id="fileOut"></div>
<div class="row"><button id="export" disabled>Export manifest with this threshold</button></div>

<script type="module" src="./main.ts"></script>
</body>
</html>
