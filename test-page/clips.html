<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Clips</title>
<style>
	body { font: 16px system-ui, sans-serif; margin: 0 auto; max-width: 720px; padding: 16px; }
	.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
	.clip { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
	.clip span { font-size: 12px; opacity: .6; width: 5em; }
	audio { flex: 1; }
</style>
</head>
<body>
<h1>Training Clips</h1>
<div class="row">
	<label>Phrase folder <input id="phrase" value="prometheus"></label>
	<select id="split">
		<option>positive_train</option><option>negative_train</option>
		<option>positive_test</option><option>negative_test</option>
	</select>
	<button id="go">Show 30 random</button>
	<span id="count"></span>
</div>
<div id="list"></div>
<script type="module">
	const $ = (id) => document.getElementById(id);
	async function show() {
		const base = `/clip-files/${$("phrase").value}/${$("split").value}`;
		const r = await fetch(base);
		if (!r.ok) { $("count").textContent = "not found"; return; }
		const { total, files } = await r.json();
		$("count").textContent = `${total} clips in folder`;
		$("list").replaceChildren(...files.map((f, i) => {
			const d = document.createElement("div");
			d.className = "clip";
			d.innerHTML = `<span>#${i + 1}</span><audio controls preload="none" src="${base}/${f}"></audio>`;
			return d;
		}));
	}
	$("go").onclick = show;
	show();
</script>
</body>
</html>
